<header class="store-header">
    <div class="header-container">
        <a class="brand" routerLink="/" (click)="closeMobileMenu()">
            <span class="brand-mark">E</span>
            <span class="brand-name">Ebook Marketplace</span>
        </a>

        <button type="button" class="mobile-menu-button" aria-label="Toggle navigation"
            [attr.aria-expanded]="isMobileMenuOpen()" (click)="toggleMobileMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="desktop-navigation">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                Discover
            </a>
        </nav>

        <div class="desktop-actions">
            @if (isAuthenticated()) {
            <a class="account-link" routerLink="/account">My Account</a>
            <button type="button" class="logout-button" (click)="logout()">
                Sign out
            </button>
            } @else {
            <a class="login-link" routerLink="/login">Log in</a>
            <a class="register-button" routerLink="/register">Create account</a>
            }
        </div>
    </div>

    @if (isMobileMenuOpen()) {
    <nav class="mobile-navigation">
        <a routerLink="/" (click)="closeMobileMenu()">Discover</a>

        @if (isAuthenticated()) {
        <a routerLink="/account" (click)="closeMobileMenu()">My Account</a>
        <button type="button" (click)="logout()">Sign out</button>
        } @else {
        <a routerLink="/login" (click)="closeMobileMenu()">Log in</a>
        <a routerLink="/register" (click)="closeMobileMenu()">Create account</a>
        }
    </nav>
    }
</header>
