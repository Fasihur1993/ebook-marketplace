spring.application.name=ebook-marketplace-backend

# Server
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ebook_marketplace}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=3600

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# Initial administrator setup
security.admin.setup-key=${ADMIN_SETUP_KEY}

# Ebook PDF storage
ebook.storage.location=${EBOOK_STORAGE_LOCATION:./private-storage/ebooks}
ebook.storage.max-file-size-bytes=${EBOOK_MAX_FILE_SIZE_BYTES:52428800}

# Ebook cover and preview storage
ebook.storage.cover-location=${EBOOK_COVER_STORAGE_LOCATION:./private-storage/ebooks/covers}
ebook.storage.preview-location=${EBOOK_PREVIEW_STORAGE_LOCATION:./private-storage/ebooks/previews}

# Private payment screenshot storage
payment.storage.screenshot-location=${PAYMENT_SCREENSHOT_STORAGE_LOCATION:./private-storage/payments/screenshots}
payment.storage.max-screenshot-size=${PAYMENT_SCREENSHOT_MAX_SIZE:5242880}

# PDF preview generation
ebook.preview.max-pages=3
ebook.preview.image-dpi=120

# Multipart upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB